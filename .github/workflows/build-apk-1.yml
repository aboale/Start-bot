name: Build Android APK

# يعمل تلقائيًا عند رفع الكود لفرع main، أو يدويًا من تبويب Actions في GitHub
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      # يفرض هذا القيد إصدار pip المستقر على كل استدعاء pip يحدث أثناء
      # الوظيفة بأكملها (بما فيها البيئات المعزولة الداخلية التي ينشئها
      # python-for-android تلقائيًا)، بدل الاعتماد على تعديل ملفات معينة
      PIP_CONSTRAINT: ${{ github.workspace }}/pip-constraints.txt
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create pip constraints file
        run: echo "pip==23.3.2" > "${{ github.workspace }}/pip-constraints.txt"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git unzip zip \
            libffi-dev libssl-dev \
            libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev \
            zlib1g-dev

      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install "buildozer==1.5.0" "cython>=3.0.10,<3.1" python-for-android

      - name: Patch python-for-android to pin a stable pip version
        run: |
          python3 - <<'PY'
          import pythonforandroid, pathlib
          pkg_dir = pathlib.Path(pythonforandroid.__file__).parent
          patched = 0
          for f in pkg_dir.rglob("*.py"):
              text = f.read_text()
              if "pip install -U pip" in text:
                  new_text = text.replace("pip install -U pip", "pip install -U 'pip==23.3.2'")
                  f.write_text(new_text)
                  print("Patched:", f)
                  patched += 1
          print(f"Total files patched: {patched}")
          PY

      - name: Build APK (debug)
        run: |
          yes | buildozer -v android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: alpha-extraction-bot-apk
          path: bin/*.apk
          retention-days: 30
